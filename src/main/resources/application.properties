server.port=${PORT:8081}
spring.application.name=category-service

# Supabase PostgreSQL
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP ? fast startup + no commit errors
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.auto-commit=true

# JPA / Hibernate ? fast boot without metadata queries or dialect crashes
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# THE TWO LINES THAT FIX EVERYTHING (non-deprecated + explicit dialect)
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Fix "Cannot commit when autoCommit is enabled"
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Fast overall startup
spring.main.lazy-initialization=true