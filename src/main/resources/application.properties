server.port=${PORT:8081}
spring.application.name=category-service

# === SUPABASE DB ===
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === HikariCP ? make it FAST and forgiving at startup ===
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=8000        # was 10000 ? 8s
spring.datasource.hikari.validation-timeout=5000        # important!
spring.datasource.hikari.initialization-fail-timeout=0 # don?t fail startup if DB is slow

# This is the killer setting for Supabase:
spring.datasource.hikari.connection-init-sql=SELECT 1

# === JPA / Hibernate ? stop the 90-second schema validation hell ===
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# These three lines are the magic that cuts 60?80 seconds:
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none
spring.jpa.properties.javax.persistence.schema-generation.database.action=none
spring.jpa.properties.hibernate.hbm2ddl.auto=none

# Optional but helps a lot:
spring.jpa.defer-datasource-initialization=true   # Spring Boot 3.x
spring.sql.init.mode=never

# === Other good practices ===
spring.main.lazy-initialization=true     # you already have this ? keep it
spring.jpa.open-in-view=false            # good
spring.jpa.show-sql=false                # set to false in prod, saves a few seconds
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.type.descriptor.sql=off