server.port=${PORT:8081}
spring.application.name=category-service

# DB
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-init-sql=SELECT 1

# JPA  the only combination that actually works in 2025
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# THE TWO LINES THAT KILL THE 90-SECOND DELAY DEAD
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.delay_jdbc_metadata_access=true 
# THIS IS THE ONLY COMBINATION THAT ACTUALLY WORKS IN SPRING BOOT 3.3 + HIBERNATE 6
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
# Extra validation killers
spring.jpa.properties.hibernate.check_nullability=false
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# Fast boot
spring.main.lazy-initialization=true
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
spring.datasource.hikari.auto-commit=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true