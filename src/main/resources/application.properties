server.port=${PORT:8081}
spring.application.name=category-service

# Supabase
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP ? fast & stable
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-init-sql=SELECT 1

# THE ONLY TWO LINES THAT WORK IN REAL LIFE (ignore all deprecation warnings)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Fix the "Cannot commit when autoCommit is enabled" error
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Standard settings
spring.jpa.hibernate.ddl-auto=none
spring.main.lazy-initialization=true
spring.sql.init.mode=never