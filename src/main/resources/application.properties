server.port=${PORT:8081}
spring.application.name=category-service

#=== SUPABASE DB ===
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#=== HikariCP ? make it FAST and forgiving at startup ===
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=0

# This is the killer setting for Supabase:
spring.datasource.hikari.connection-init-sql=SELECT 1

#=== JPA / Hibernate ? stop the 90-second schema validation hell ===
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# These three lines are the magic that cuts 60?80 seconds:
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none
spring.jpa.properties.javax.persistence.schema-generation.database.action=none
spring.jpa.properties.hibernate.hbm2ddl.auto=none
# THE BIG ONE ? tell Hibernate: "DO NOT touch the database at all during startup"
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# MOST IMPORTANT ? completely disable schema validation at startup
spring.jpa.properties.hibernate.schema_validation.enabled=false

# Optional but helps a lot:
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# === Other good practices ===
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.type.descriptor.sql=off