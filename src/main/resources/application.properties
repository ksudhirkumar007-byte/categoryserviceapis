# application.properties ? THE ONLY ONE THAT WORKS 100% OF THE TIME
server.port=${PORT:8081}
spring.application.name=category-service

# Supabase
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP ? fast + no commit errors
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-init-sql=SELECT 1

# THIS IS THE ONLY LINE THAT ACTUALLY DISABLES THE 70-SECOND METADATA DELAY
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# These two lines fix the "Cannot commit when autoCommit" error forever
spring.datasource.hikari.auto-commit=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Standard settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.main.lazy-initialization=true